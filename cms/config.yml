# Staging configuration for Decap CMS. NOT deployed to public/admin until OAuth is configured.
# GitHub Pages does not provide the Decap GitHub OAuth service by itself.
backend:
  name: github
  repo: BerniK-13/ms-emotion-cars
  branch: main
  base_url: https://REPLACE-WITH-SECURE-OAUTH-SERVICE.example
media_folder: public/images/fahrzeuge
public_folder: /images/fahrzeuge
publish: true
collections:
  - name: vehicles
    label: Fahrzeuge
    label_singular: Fahrzeug
    folder: content/vehicles
    create: true
    delete: false
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: model
    summary: "{{brand}} {{model}} — {{status}}"
    fields:
      - {label: Slug, name: slug, widget: string, hint: "Stabiler URL-Name; nach Veröffentlichung nicht ändern."}
      - {label: Marke, name: brand, widget: string}
      - {label: Modell, name: model, widget: string}
      - {label: Kategorie, name: type, widget: string, required: false}
      - {label: Status, name: status, widget: select, options: [draft, in_stock, sold], default: draft}
      - {label: Veröffentlicht, name: published, widget: boolean, default: false}
      - {label: Kurzlabel, name: tag, widget: string, required: false}
      - {label: Hauptfoto, name: image, widget: image, required: false}
      - label: Bildergalerie
        name: images
        widget: list
        required: false
        field: {label: Fahrzeugfoto, name: image, widget: image}
      - {label: Preis in EUR, name: price, widget: number, value_type: int, required: false, hint: "Nur bei In Stock sichtbar, niemals bei Sold."}
      - {label: Interne Referenz, name: reference, widget: string, required: false}
      - {label: Datenstand, name: updated, widget: string, required: false}
      - label: Fahrzeugdaten
        name: facts
        widget: list
        required: false
        fields:
          - {label: Eigenschaft, name: label, widget: string}
          - {label: Wert, name: value, widget: string}
      - label: Weitere technische Details
        name: details
        widget: list
        required: false
        fields:
          - {label: Eigenschaft, name: label, widget: string}
          - {label: Wert, name: value, widget: string}
      - {label: Ausstattung / Highlights, name: highlights, widget: list, required: false, field: {label: Highlight, name: highlight, widget: string}}
