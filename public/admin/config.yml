# MS EMotion Cars CMS. Änderungen auf main lösen automatisch einen neuen Website-Build aus.
backend:
  name: github
  repo: BerniK-13/ms-emotion-cars
  branch: main
  base_url: https://ms-emotion-cms-auth.bwalser13.workers.dev
  auth_endpoint: auth
media_folder: public/images/fahrzeuge
public_folder: /ms-emotion-cars/images/fahrzeuge
publish: false
collections:
  - name: general
    label: "Allgemeines"
    label_singular: "Einstellung"
    description: "Zentrale Einstellungen für das Erscheinungsbild der Website."
    files:
      - label: "Design & Erscheinungsbild"
        name: design
        file: "content/design.json"
        fields:
          - {label: "Werkseinstellungen verwenden", name: factory_defaults, widget: boolean, default: true, hint: "EIN = ursprüngliches Website-Design unverändert. AUS = eigene Designwerte verwenden. Nach dem Umschalten oben Speichern klicken."}
          - {label: "Headline-Farbe (helle Seiten)", name: headline_color, widget: color, default: "#1a1b1c", allowInput: true, enableAlpha: false, hint: "Nur Überschriften auf hellen Flächen; weiße Überschriften auf dunklen Bannern bleiben erhalten."}
          - {label: "Akzentfarbe", name: accent_color, widget: color, default: "#991B26", allowInput: true, enableAlpha: false, hint: "Rote Linien und CSS-Akzente; Bilder und Logos bleiben unverändert."}
          - {label: "Fließtextgröße in Pixel", name: body_font_size, widget: number, value_type: int, min: 14, max: 22, step: 1, default: 16}
          - {label: "Headline-Größe in Prozent", name: headline_scale, widget: number, value_type: int, min: 85, max: 115, step: 5, default: 100, hint: "100 % entspricht der bisherigen Gestaltung. Responsive Größen bleiben erhalten."}
          - {label: "Schriftart für Fließtext", name: font_family, widget: select, options: [{label: "DM Sans (Standard)", value: "DM Sans"}, {label: "Arial", value: "Arial"}, {label: "Georgia", value: "Georgia"}], default: "DM Sans"}
  - name: vehicles
    label: Fahrzeuge
    label_singular: Fahrzeug
    folder: content/vehicles
    create: true
    delete: false
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: model
    summary: "{{brand}} {{model}} — {{status}}"
    editor:
      preview: false
    fields:
      - {label: Slug, name: slug, widget: string, hint: "Stabiler URL-Name; nach Veröffentlichung nicht ändern."}
      - {label: Marke, name: brand, widget: string}
      - {label: Modell, name: model, widget: string}
      - {label: Kategorie, name: type, widget: string, required: false}
      - {label: Status, name: status, widget: radio, options: [{label: 'Draft – nicht sichtbar', value: draft}, {label: 'In Stock – verfügbar', value: in_stock}, {label: 'Sold – verkauft', value: sold}], default: draft}
      - {label: Veröffentlicht, name: published, widget: boolean, default: false, hint: 'Nur veröffentlichte Fahrzeuge erscheinen auf der Website. Nach dem Speichern dauert die Veröffentlichung einige Minuten.'}
      - {label: Kurzlabel, name: tag, widget: string, required: false}
      - {label: 'Fahrzeugbeschreibung – Einleitung vor technischen Details', name: intro_text, widget: text, required: false, hint: 'Individueller Einleitungstext auf der Fahrzeugdetailseite; jederzeit bearbeitbar.'}
      - {label: Hauptfoto, name: image, widget: image, required: false}
      - label: 'Bildergalerie – weitere Fahrzeugfotos'
        name: images
        widget: list
        required: false
        collapsed: false
        minimize_collapsed: false
        summary: 'Foto {{index}}'
        hint: 'Fotoeinträge zeigen eine Bildvorschau und lassen sich verschieben. Vorhandene Fotos bleiben erhalten.'
        field: {label: Fahrzeugfoto, name: image, widget: image}
      - {label: Preis in EUR, name: price, widget: number, value_type: int, required: false, hint: "Nur bei In Stock sichtbar, niemals bei Sold."}
      - label: "Weitere Preisangaben (nur In Stock)"
        name: additional_prices
        widget: list
        required: false
        max: 2
        collapsed: false
        summary: "{{fields.label}} – {{fields.amount}} EUR"
        hint: "Zusätzlich zum bisherigen Hauptpreis bis zu zwei weitere Preise. Jeder Preis erhält eine eigene Bezeichnung, z. B. EU-Export oder Netto. Keine automatische Steuerberechnung."
        fields:
          - {label: "Preisbezeichnung", name: label, widget: string, hint: "z. B. EU-Exportpreis oder Nettopreis"}
          - {label: "Betrag in EUR", name: amount, widget: number, value_type: int, min: 0}
      - {label: "Hinweis zu den Preisen (optional)", name: price_note, widget: string, required: false, hint: "z. B. MwSt. ausweisbar. Nur bei In Stock sichtbar."}
      - {label: Interne Referenz, name: reference, widget: string, required: false}
      - {label: Datenstand, name: updated, widget: string, required: false}
      - label: "Technische Daten – direkt bearbeiten"
        name: specs
        widget: object
        collapsed: false
        summary: "Kilometerstand, Leistung, Getriebe und weitere Angaben"
        fields:
          - {label: "Kilometerstand", name: mileage, widget: string, required: false}
          - {label: "Erstzulassung", name: registration, widget: string, required: false}
          - {label: "Leistung", name: power, widget: string, required: false}
          - {label: "Getriebe", name: transmission, widget: string, required: false}
          - {label: "Kraftstoff", name: fuel, widget: string, required: false}
          - {label: "Antrieb", name: drive, widget: string, required: false}
          - {label: "Fahrzeugzustand", name: condition, widget: string, required: false}
          - {label: "Karosserie", name: body, widget: string, required: false}
          - {label: "Hubraum", name: displacement, widget: string, required: false}
          - {label: "Sitzplätze", name: seats, widget: string, required: false}
          - {label: "Türen", name: doors, widget: string, required: false}
          - {label: "Außenfarbe", name: exterior, widget: string, required: false}
          - {label: "Innenausstattung", name: interior, widget: string, required: false}
          - {label: "Abgasnorm", name: emission, widget: string, required: false}
          - {label: "CO₂-Ausstoß", name: co2, widget: string, required: false}
          - {label: "0–100 km/h", name: acceleration, widget: string, required: false}
          - {label: "Höchstgeschwindigkeit", name: top_speed, widget: string, required: false}
          - {label: "Servicehistorie", name: service, widget: string, required: false}
      - label: "Weitere Angaben (optional)"
        name: details
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - {label: Bezeichnung, name: label, widget: string}
          - {label: Angabe, name: value, widget: string}
      - {label: "Ausstattung / Highlights – ein Eintrag pro Zeile", name: highlights_text, widget: text, required: false, hint: "Einfach alle Highlights untereinander eingeben. Kein einzelnes Aufklappen mehr nötig."}

  - name: collection_products
    label: "MS Collection – Produkte"
    label_singular: Produkt
    description: "Produkte, Fotos, Größen und Farben direkt pflegen. Änderungen erscheinen nach dem Website-Build."
    folder: content/products
    create: true
    delete: false
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{category}}"
    fields:
      - {label: "URL-Kürzel (nach Veröffentlichung nicht ändern)", name: slug, widget: string}
      - {label: Produktname, name: name, widget: string}
      - {label: Kategorie, name: category, widget: string}
      - {label: Beschreibung, name: description, widget: text}
      - {label: Hauptbild, name: image, widget: image}
      - {label: Bildbeschreibung, name: alt, widget: string, required: false}
      - {label: "Weitere Produktfotos", name: images, widget: list, required: false, field: {label: Foto, name: image, widget: image}}
      - {label: Material, name: material, widget: string, required: false}
      - {label: Passform, name: fit, widget: string, required: false}
      - {label: Pflege, name: care, widget: text, required: false}
      - {label: Verfügbarkeit, name: availability, widget: string, required: false}
      - {label: "Größen (jeweils ein Eintrag)", name: sizes, widget: list, required: false, field: {label: Größe, name: size, widget: string}}
      - {label: "Farben (jeweils ein Eintrag)", name: colors, widget: list, required: false, field: {label: Farbe, name: color, widget: string}}

