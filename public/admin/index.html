<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MS EMotion Cars · Fahrzeugverwaltung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ms-red:#991b26;--ms-ink:#17191d;--ms-bg:#f3f4f6}
    body{margin:0;background:var(--ms-bg);color:var(--ms-ink);font-family:"DM Sans",Arial,sans-serif}
    noscript{display:block;padding:3rem}
    /* CMS UI: keep all controls and editor functionality intact. */
    [class*="AppHeader"]{background:#17191d!important}
    [class*="AppHeader"] a,[class*="AppHeader"] button{font-family:"DM Sans",Arial,sans-serif!important}
    [class*="CollectionTop"] h1,[class*="Editor"] h1{letter-spacing:-.025em}
    [class*="ControlPane"]{background:#f3f4f6!important}
    [class*="ControlPane"] [class*="ControlContainer"]{margin-bottom:18px}
    [class*="ControlPane"] input:not([type="checkbox"]):not([type="radio"]),[class*="ControlPane"] textarea,[class*="ControlPane"] select{border-radius:8px!important;border-color:#d8dce1!important;font-family:"DM Sans",Arial,sans-serif!important}
    [class*="ControlPane"] input:focus,[class*="ControlPane"] textarea:focus{border-color:var(--ms-red)!important;outline-color:var(--ms-red)!important}
    [class*="ControlPane"] label{font-family:"DM Sans",Arial,sans-serif!important;letter-spacing:.035em}
    [class*="Editor"] button,[class*="Collection"] button{border-radius:7px}
    @media(max-width:900px){[class*="ControlPane"]{padding:16px!important}}
  </style>
</head>
<body>
  <noscript>Für die CMS-Verwaltung muss JavaScript aktiviert sein.</noscript>
  <!-- Decap bundles React internally; expose React.createElement for custom preview registration. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    (function(){
      const h=window.React && window.React.createElement;
      if(!h || !window.CMS) { console.error("MS EMotion Cars: CMS preview could not initialize"); return; }
      const e=(tag,props,...children)=>h(tag,props,...children);
      const val=(data,key)=>data.get(key)||'';
      const list=(data,key)=>{const v=data.get(key);return v&&typeof v.toJS==='function'?v.toJS():Array.isArray(v)?v:[]};
      const css=`
        *{box-sizing:border-box}
        body{margin:0;background:#101113;color:#f5f5f5;font:14px/1.55 "DM Sans",Arial,sans-serif}
        .wrap{min-height:100vh;padding:38px 32px 80px;max-width:920px;margin:auto}
        .top{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #32343a;padding-bottom:20px;margin-bottom:38px}
        .brand{font-size:12px;letter-spacing:.18em;font-weight:700;color:#e9e9e9}
        .brand b{color:#991b26}.status{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid #555;padding:6px 10px;border-radius:3px;color:#bbb}
        .eyebrow{color:#b33942;text-transform:uppercase;letter-spacing:.22em;font-size:11px;font-weight:700;margin-bottom:14px}
        h1{font-size:clamp(30px,5vw,50px);line-height:1.12;font-weight:600;letter-spacing:-.045em;margin:0 0 14px}
        .sub{color:#aaa;font-size:14px;margin:0 0 30px}
        .hero{aspect-ratio:16/9;background:linear-gradient(140deg,#25272b,#101113);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #303136}
        .hero img{width:100%;height:100%;object-fit:cover}.empty{color:#7e8187;text-align:center;letter-spacing:.06em}
        .thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
        .thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#25272b}
        .section{margin-top:36px;border-top:1px solid #303136;padding-top:20px}
        .section h2{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#aaa;font-weight:600;margin:0 0 18px}
        .specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px}
        .spec{border-bottom:1px solid #292b2e;padding-bottom:12px}.spec span{display:block;font-size:11px;color:#8f9399;margin-bottom:4px}.spec strong{font-size:15px;font-weight:500}
        .price{font-size:25px;letter-spacing:-.03em}.note{font-size:12px;color:#8f9399;margin-top:24px}
        .highlights{padding-left:18px;color:#ddd}.highlights li{margin:8px 0}
        @media(max-width:600px){.wrap{padding:24px 18px}.specs{grid-template-columns:1fr}}
      `;
      window.CMS.registerPreviewStyle(css,{raw:true});
      window.CMS.registerPreviewTemplate('vehicles',function(props){
        const d=props.entry.get('data');
        const brand=val(d,'brand'),model=val(d,'model'),status=val(d,'status');
        const photos=list(d,'images').map(p=>typeof p==='string'?p:p&&p.image).filter(Boolean);
        const main=val(d,'image')||photos[0];
        const url=p=>{if(!p)return '';if(/^https?:/.test(p))return p;return p.startsWith('/ms-emotion-cars/')?p:'/ms-emotion-cars/'+p.replace(/^\//,'')};
        const img=main?props.getAsset(main):null;
        const src=img&&(typeof img.toString==='function'?img.toString():img)||url(main);
        const facts=list(d,'facts'),details=list(d,'details'),highlights=list(d,'highlights');
        const item=x=>e('div',{className:'spec',key:x.label},e('span',null,x.label),e('strong',null,x.value));
        const price=val(d,'price');
        return e('div',{className:'wrap'},
          e('div',{className:'top'},e('div',{className:'brand'},'MS ',e('b',null,'EMOTION'),' CARS'),e('div',{className:'status'},status==='sold'?'SOLD':status==='in_stock'?'IN STOCK':'ENTWURF')),
          e('div',{className:'eyebrow'},brand||'FAHRZEUG'),
          e('h1',null,[brand,model].filter(Boolean).join(' ')||'Neues Fahrzeug'),
          e('p',{className:'sub'},[val(d,'type'),val(d,'tag')].filter(Boolean).join(' · ')),
          e('div',{className:'hero'},src?e('img',{src,alt:[brand,model].join(' ')}):e('div',{className:'empty'},'FAHRZEUGFOTO HINZUFÜGEN')),
          photos.length>1?e('div',{className:'thumbs'},...photos.slice(0,10).map((p,i)=>e('img',{src:url(p),alt:'Galeriebild '+(i+1),key:i}))):null,
          price!==''&&price!=null&&status==='in_stock'?e('div',{className:'section'},e('h2',null,'PREIS'),e('div',{className:'price'},new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(price)))):null,
          facts.length?e('div',{className:'section'},e('h2',null,'FAHRZEUGDATEN'),e('div',{className:'specs'},...facts.map(item))):null,
          details.length?e('div',{className:'section'},e('h2',null,'TECHNISCHE DETAILS'),e('div',{className:'specs'},...details.map(item))):null,
          highlights.length?e('div',{className:'section'},e('h2',null,'AUSSTATTUNG'),e('ul',{className:'highlights'},...highlights.map((x,i)=>e('li',{key:i},typeof x==='string'?x:x.highlight||'')))):null,
          e('p',{className:'note'},'CMS-Vorschau · Die endgültige Darstellung auf der Website kann leicht abweichen.')
        );
      });
    })();
  </script>
</body>
</html>
