<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>MS EMotion Cars · Fahrzeugverwaltung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ms-red:#991b26;--ms-ink:#17191d;--ms-bg:#f3f4f6}
    body{margin:0;background:var(--ms-bg);color:var(--ms-ink);font-family:"DM Sans",Arial,sans-serif}
    noscript{display:block;padding:3rem}
    /* CMS UI: keep all controls and editor functionality intact. */
    [class*="AppHeader"]{background:#17191d!important}
    [class*="AppHeader"] a,[class*="AppHeader"] button{font-family:"DM Sans",Arial,sans-serif!important}
    [class*="CollectionTop"] h1,[class*="Editor"] h1{letter-spacing:-.025em}
    [class*="ControlPane"]{background:#f3f4f6!important}
    [class*="ControlPane"] [class*="ControlContainer"]{margin-bottom:18px}
    [class*="ControlPane"] input:not([type="checkbox"]):not([type="radio"]),[class*="ControlPane"] textarea,[class*="ControlPane"] select{border-radius:8px!important;border-color:#d8dce1!important;font-family:"DM Sans",Arial,sans-serif!important}
    [class*="ControlPane"] input:focus,[class*="ControlPane"] textarea:focus{border-color:var(--ms-red)!important;outline-color:var(--ms-red)!important}
    [class*="ControlPane"] label{font-family:"DM Sans",Arial,sans-serif!important;letter-spacing:.035em}
    [class*="Editor"] button,[class*="Collection"] button{border-radius:7px}
    /* Compact native Decap image-widget thumbnails inside expanded gallery entries. */
    [class*="ControlPane"] [class*="ImageControl"] img,[class*="ControlPane"] [class*="ImagePreview"] img{max-width:180px!important;max-height:115px!important;object-fit:contain!important}
    [class*="ControlPane"] [class*="ListControl"] [class*="ImageControl"]{max-width:100%}
    @media(max-width:900px){[class*="ControlPane"]{padding:16px!important}}
  </style>
</head>
<body>
  <noscript>Für die CMS-Verwaltung muss JavaScript aktiviert sein.</noscript>
  <script src="https://unpkg.com/decap-cms@3/dist/decap-cms.js"></script>
  <script>
    // Style Decap's built-in preview. Do not load a second React instance:
    // custom React elements from a separate UMD bundle crash Decap with error #525.
    (function () {
      if (!window.CMS) return;
      window.CMS.registerPreviewStyle(`
        *,*::before,*::after{box-sizing:border-box}
        html,body{background:#111214!important;color:#f3f3f3!important;font-family:"DM Sans",Arial,sans-serif!important}
        body{margin:0!important;padding:34px 32px 80px!important;font-size:14px!important;line-height:1.6!important}
        body>div{max-width:880px;margin:0 auto}
        h1,h2,h3,h4{font-family:"DM Sans",Arial,sans-serif!important;color:#fff!important;line-height:1.14!important;letter-spacing:-.035em!important}
        h1{font-size:clamp(30px,5vw,48px)!important;margin:24px 0 24px!important;font-weight:600!important}
        h2{font-size:20px!important;margin:28px 0 12px!important}
        h3{font-size:16px!important}
        p,li,span,div{font-family:"DM Sans",Arial,sans-serif}
        p{color:#c2c3c6!important}
        strong,b{color:#f4f4f4!important}
        img{display:block;max-width:100%!important;height:auto!important;max-height:440px!important;object-fit:contain!important;background:#202125}
        a{color:#c33a44!important}
        hr{border:0;border-top:1px solid #34363a;margin:24px 0}
        blockquote{border-left:3px solid #991b26;padding:8px 18px;color:#c2c3c6}
        table{width:100%;border-collapse:collapse}
        td,th{padding:12px;border-bottom:1px solid #34363a;text-align:left}
        @media(max-width:650px){body{padding:24px 16px 60px!important}}
      `, {raw:true});
    })();
  </script>
</body>
</html>
